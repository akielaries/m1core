# every push runs the same regression the project is developed against: 148
# checks across 10 testbenches, plus a synthesis pass.
#
# the point is not that it runs the tests, it is that it runs them somewhere
# that has none of this machine's state. the generated files are the reason:
# the device headers, the memory map and three rtl files all come out of
# boards/*/mcu.yaml, and a stale one is invisible locally because it is already
# on disk. `make checkgen` regenerates and diffs, so this catches a commit that
# hand edited a generated file or changed the description and forgot to rerun.

name: ci

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            iverilog gcc-arm-none-eabi python3-yaml yosys

      # the whole suite: generated file checks, the mcu.yaml round trip, the
      # dap and core testbenches, the randomised isa test against its reference
      # model, exceptions, peripherals and the expansion windows
      - name: regression
        run: make -C sim all

      # every rtl file has to parse as strict verilog 2001, including the
      # peripherals this board does not instantiate. gowinsynthesis rejects
      # systemverilog outright, so this is the cheap early warning
      - name: verilog 2001 lint
        run: iverilog -g2001 -Wall -t null rtl/*/*.v

      # top.v is deliberately not synthesised here: it instantiates the gowin
      # pll ip, which is device specific and generated by the vendor tool. the
      # portable half of the design is what ci can meaningfully check
      - name: synthesis check, both cores
        run: |
          for core in M1CORE_FORCE_MULTICYCLE M1CORE_PIPELINE; do
            echo "== $core"
            yosys -p "read_verilog -D$core rtl/core/*.v rtl/debug/*.v \
                      rtl/periph/*.v rtl/mcu/*.v rtl/pipe/*.v; \
                      hierarchy -check -top m1core_mcu; proc; opt; check -assert"
          done

      - name: core selection stays consistent
        run: |
          python3 tools/select_core.py multicycle && python3 tools/check_project.py
          python3 tools/select_core.py pipeline   && python3 tools/check_project.py

      # a different seed every run, so ci explores programs the checked in seed
      # never generates. a failure here is reproducible: the seed is printed
      - name: randomised isa test, fresh seed, both cores
        run: |
          SEED=$(( RANDOM + 1 ))
          echo "seed $SEED"
          make -C sim isarand  ISARAND_SEED=$SEED ISARAND_BLOCKS=80 ISARAND_LEN=16
          make -C sim isarandp ISARAND_SEED=$SEED ISARAND_BLOCKS=80 ISARAND_LEN=16
